# 前端容器 nginx 配置 — 行为与 vite dev proxy 一致（/api 反代后端，/tianditu 反代天地图瓦片）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 后端 API 反代（SSE 必须 关闭缓冲 + 长读超时 + HTTP/1.1）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # SSE 流式（节点进度 / 报告增量 / RAG 流式回答）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 天地图瓦片代理：删除 Referer（带不匹配 Referer 会被天地图 403）
    location /tianditu/ {
        resolver 223.5.5.5 valid=60s;
        proxy_pass https://t0.tianditu.com/;
        proxy_set_header Referer "";
        proxy_set_header Host t0.tianditu.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 1h;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
